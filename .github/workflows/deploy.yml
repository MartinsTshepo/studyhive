# Builds the Vite/React app and deploys it to GitHub Pages.
#
# One-time setup (repo → Settings):
#   1. Pages → Build and deployment → Source: "GitHub Actions"
#   2. Secrets and variables → Actions → add two repository secrets:
#        VITE_SUPABASE_URL        (Supabase → Project Settings → API → Project URL)
#        VITE_SUPABASE_ANON_KEY   (the anon / publishable key — NOT the service_role / secret key)
name: Deploy StudyHive to GitHub Pages

on:
  # Runs on pushes to the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Permissions the GITHUB_TOKEN needs to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress production deploy finish
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail early if Supabase secrets are missing
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing repository secrets VITE_SUPABASE_URL and/or VITE_SUPABASE_ANON_KEY. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
